name: Policy Fixtures

on:
  pull_request:
    paths:
      - '.github/actions/scan-plugins/policy/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm install -g @anthropic-ai/claude-code@latest
          pip install jsonschema
      - name: Run fixture suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::warning::ANTHROPIC_API_KEY not set; skipping fixture suite"
            exit 0
          fi
          bash .github/actions/scan-plugins/policy/test-fixtures.sh
